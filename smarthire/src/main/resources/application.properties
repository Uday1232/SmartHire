spring.application.name=smarthire

spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/smarthire
spring.datasource.username=postgres
spring.datasource.password=0000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port= 8083

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4o-mini

# Frontend redirect URL for OAuth2 success
app.frontend.url=http://localhost:3000

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
